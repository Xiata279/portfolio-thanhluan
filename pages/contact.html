<body>
    <section id="contact" class="contact" style="padding-top: 120px;">
        <div class="container">
            <div class="section-header">
                <span class="section-badge">Liên Hệ</span>
                <h1 class="section-title">CONTACT ME</h1>
                <p class="section-subtitle">Hãy cùng làm việc hoặc chỉ đơn giản là trò chuyện!</p>
            </div>
            <div class="contact-content">
                <div class="contact-info">
                    <div class="info-card">
                        <div class="info-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <div class="info-text">
                            <h4>Địa Điểm</h4>
                            <p>Quận 9, TP. Hồ Chí Minh, Việt Nam</p>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon"><i class="fas fa-phone"></i></div>
                        <div class="info-text">
                            <h4>Điện Thoại</h4>
                            <a href="tel:0816042709">0816042709</a>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon"><i class="fas fa-envelope"></i></div>
                        <div class="info-text">
                            <h4>Email</h4>
                            <a href="mailto:nguyenthanhluan.270924@gmail.com">nguyenthanhluan.270924@gmail.com</a>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon"><i class="fab fa-discord"></i></div>
                        <div class="info-text">
                            <h4>Cộng Đồng Discord</h4>
                            <a href="https://discord.gg/NUh6Mf22" target="_blank">Ma Đạo Community</a>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon"><i class="fab fa-github"></i></div>
                        <div class="info-text">
                            <h4>GitHub</h4>
                            <a href="https://github.com/luanem2709" target="_blank">@luanem2709</a>
                        </div>
                    </div>
                    <div class="contact-social">
                        <h4>Theo Dõi Tôi</h4>
                        <div class="social-links-contact">
                            <a href="https://facebook.com/LuanEm2709" target="_blank" title="Facebook"><i
                                    class="fab fa-facebook"></i></a>
                            <a href="https://github.com/luanem2709" target="_blank" title="GitHub"><i
                                    class="fab fa-github"></i></a>
                            <a href="https://discord.gg/NUh6Mf22" target="_blank" title="Discord Community"><i
                                    class="fab fa-discord"></i></a>
                            <a href="https://www.tiktok.com/@LuanEm2709" target="_blank" title="TikTok"><i

                            <a href="https://discord.gg/8QC2bpBE" target="_blank" title="Ma Đạo Store"><i
                                    class="fas fa-store"></i></a>
                        </div>
                    </div>
                </div>
                <form class="contact-form" id="contact-form">
                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder="Họ và Tên *" required>
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Email *" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="form-group">
                        <input type="text" id="subject" name="subject" placeholder="Tiêu Đề *" required>
                        <i class="fas fa-tag"></i>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" rows="5" placeholder="Tin Nhắn *" required></textarea>
                        <i class="fas fa-comment"></i>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Gửi Tin Nhắn
                    </button>
                </form>
            </div>
        </div>
